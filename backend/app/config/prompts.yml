    import org.junit.jupiter.api.BeforeEach;
    import org.junit.jupiter.api.Test;
    import static org.junit.jupiter.api.Assertions.*;
    // Add any other necessary imports for the implementation class

    public class {class_name}Test {{
        private {class_name} instance;

        @BeforeEach
        void setUp() {{
            // Use the actual implementation class found in the code structure
            instance = new {class_name}Impl(); // Replace with actual implementation class name
        }}

        @Test
        void test{MethodName}() {{
            // Test setup with appropriate test values
            // Method call using interface instance
            // Assertions based on expectations
        }}

        @Test
        void test{MethodName}_EdgeCase() {{
            // Test edge case scenario
            // Method call with edge case values
            // Assertions
        }}
    }}
    ```
    
    # For interfaces without implementations (using Mockito):
    ```java
    package {package_name};

    import org.junit.jupiter.api.BeforeEach;
    import org.junit.jupiter.api.Test;
    import static org.junit.jupiter.api.Assertions.*;
    import org.mockito.Mockito;

    public class {class_name}Test {{
        private {class_name} instance;

        @BeforeEach
        void setUp() {{
            // Create mock instance using Mockito
            instance = Mockito.mock({class_name}.class);
        }}

        @Test
        void test{MethodName}() {{
            // Test setup
            // Set up mock behavior if needed
            // Mockito.when(instance.{method_name}(parameters)).thenReturn(expectedValue);
            
            // Method call
            // Assertions
        }}

        @Test
        void test{MethodName}_ErrorHandling() {{
            // Test error handling scenario
            // Set up mock to throw exception if needed
            // Method call
            // Assertions for exception handling
        }}
    }}
    ```

  # 用户提示词（只包含动态测试需求）
  generate_test_user_prompt_interface: |
    # Test Requirements
    - Method name: {method_name}
    - Parameters: {parameters}
    - Return type: {return_type}
    - Expectations: {expectations}
    - Is static method: {is_static}

    Generate the complete Java unit test code.

  # ========== 修复编译错误的提示词模板 ==========
  # 系统提示词（简化版本，只关注编译错误修复）
  fix_compilation_error_system_prompt: |
    You are an expert in Java development, debugging, and JUnit 5. 
    Your ONLY task is to FIX COMPILATION ERRORS in the given test code according to the error message and the provided source code information. 
    DO NOT modify, add, or delete any business logic. 
    DO NOT replace or rewrite test methods. 
    DO NOT add new test methods. 
    KEEP ALL original methods and functionality UNCHANGED. 

    # Static Context
    {static_context}

    # Requirements 
    1. Focus on analyzing and fixing the test file code based on the provided source code information and compilation error message.
    2. Carefully analyze the compilation error message to locate the exact position of the error in the test code.
    3. Refer to the source code information to ensure that the test code is consistent with the source code in terms of method signatures, parameter types, return types, etc.
    4. Fix only syntax, import, declaration, and symbol errors; do not modify any business logic.
    5. Preserve 100% of the original test logic, including all test methods, parameters, and assertions.
    6. Add necessary imports if missing.
    7. Return the complete fixed test code.
    8. Do not include any explanations, comments, or extra text.
    9. Follow standard Java formatting.
    10. Use correct JUnit 5 annotations.
    11. If the error indicates the class constructor is private, or constructor not found, or cannot instantiate the class;
    COMPLETELY REMOVE ALL object instantiation (new Xxx() ),
    AND ALWAYS invoke methods using the class name directly: ClassName.methodName();
    DO NOT use any object instance calls.
    THIS APPLIES TO ALL METHODS, NO EXCEPTIONS.
    12. Strictly follow the error message to trace the error source in the test code, analyze field and method information in the context when necessary, determine if an undefined method is being used, and if the method exists in the static context, there is no need to redefine it.

    # Common Compilation Errors to Fix 
    - Missing semicolons 
    - Missing imports 
    - Illegal package declaration 
    - Missing braces, parentheses 
    - Undefined symbols 
    - Type mismatched 
    - Incorrect method signatures 
    - Unresolved variables 

  # 用户提示词（只包含错误代码和错误信息）
  fix_compilation_error_user_prompt: |
    # Test Code with Errors
    ```java
    {code}
    ```

    # Compilation Error Message
    {error_message}

    # Method Source
    {method_source}

    Generate the complete fixed test code with all compilation errors resolved.
